# Enable Bluetooth + bonding
CONFIG_ZMK_BLE=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=3  
CONFIG_BT_SMP=y

# Device name MUST match for stable bonding
CONFIG_BT_DEVICE_NAME="TOTEM"

# Optional: USB fallback
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=n

#BLE stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

#Power managment
#CONFIG_PM=y
#CONFIG_PM_DEVICE=y